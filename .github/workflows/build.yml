name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          python3-pip python3-dev python3-venv \
          git openjdk-17-jdk zip unzip wget curl \
          build-essential ccache \
          libssl-dev libffi-dev libsqlite3-dev

    - name: Install Android SDK
      run: |
        mkdir -p /home/runner/android-sdk/cmdline-tools
        cd /home/runner/android-sdk/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip
        mkdir latest
        mv cmdline-tools/* latest/
        export PATH=$PATH:/home/runner/android-sdk/cmdline-tools/latest/bin
        sdkmanager --sdk_root=/home/runner/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0"

    - name: Install Python packages
      run: |
        pip install --upgrade pip wheel setuptools
        pip install buildozer cython==0.29.36

    - name: Build APK with Buildozer
      env:
        ANDROIDSDK: /home/runner/android-sdk
      run: |
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pos-system-apk
        path: bin/*.apk
        retention-days: 30
        
