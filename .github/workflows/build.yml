name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    # 1. Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Install system dependencies
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          python3-pip python3-dev python3-venv \
          git openjdk-17-jdk zip unzip wget \
          build-essential ccache \
          libssl-dev libffi-dev libsqlite3-dev

    # 3. Install Python dependencies
    - name: Install Python packages
      run: |
        pip install --upgrade pip wheel setuptools
        pip install buildozer cython==0.29.36

    # 4. Install Android SDK (Fixes sdkmanager not found)
    - name: Install Android SDK
      run: |
        echo "Downloading Android commandline-tools..."
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip

        echo "Setting up Android SDK directory..."
        mkdir -p $HOME/android-sdk/cmdline-tools
        unzip -q cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools

        # Move extracted folder to 'latest'
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

        # Export environment variables so sdkmanager can run
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

        # Verify sdkmanager is installed
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --version

        echo "Accepting licenses and installing build-tools..."
        yes | $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk --licenses
        $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=$HOME/android-sdk \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

    # 5. Build the APK using Buildozer
    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    # 6. Upload the generated APK
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pos-system-apk
        path: bin/*.apk
        retention-days: 30
