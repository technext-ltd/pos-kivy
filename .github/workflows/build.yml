name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    # Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # Install system dependencies
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          python3-pip python3-dev python3-venv \
          git openjdk-17-jdk zip unzip \
          build-essential ccache \
          libssl-dev libffi-dev libsqlite3-dev

    # Install Python dependencies
    - name: Install Python packages
      run: |
        pip install --upgrade pip wheel setuptools
        pip install buildozer cython==0.29.36

    # Install Android SDK and Build-Tools
    - name: Install Android SDK
      run: |
        sudo apt install -y wget
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
        mkdir -p $HOME/android-sdk/cmdline-tools
        unzip cmdline-tools.zip -d $HOME/android-sdk/cmdline-tools
        mv $HOME/android-sdk/cmdline-tools/cmdline-tools $HOME/android-sdk/cmdline-tools/latest

        # Set environment variables
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH

        # Accept licenses and install required build-tools
        sdkmanager --sdk_root=$HOME/android-sdk --licenses
        sdkmanager --sdk_root=$HOME/android-sdk \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

    # Build the APK
    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    # Upload the generated APK
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pos-system-apk
        path: bin/*.apk
        retention-days: 30
