name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    # Set the Android SDK location globally for the entire job
    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROIDSDK: /home/runner/android-sdk

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          python3-pip python3-dev python3-venv \
          git openjdk-17-jdk zip unzip wget curl \
          build-essential ccache \
          libssl-dev libffi-dev libsqlite3-dev

    - name: Install Android SDK
      run: |
        # Use the job-level environment variable ANDROID_SDK_ROOT directly.
        
        # Create directory for Android SDK and command-line tools
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        
        # Change directory to command-line tools directory
        cd $ANDROID_SDK_ROOT/cmdline-tools
        
        # Download, unzip, and structure the command-line tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip commandlinetools-linux-11076708_latest.zip
        mkdir latest
        mv cmdline-tools/* latest/
        
        # Define the full path to the sdkmanager binary
        SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        
        # Accept licenses (required before installing components)
        yes | $SDKMANAGER --sdk_root="$ANDROID_SDK_ROOT" --licenses
        
        # Install necessary SDK components (platform-tools, Android platform, build-tools)
        $SDKMANAGER \
          --sdk_root="$ANDROID_SDK_ROOT" \
          "platform-tools" \
          "platforms;android-34" \
          "build-tools;34.0.0"

    - name: Install Python packages
      run: |
        pip install --upgrade pip wheel setuptools
        pip install buildozer cython==0.29.36

    - name: Build APK with Buildozer
      # Uses the ANDROIDSDK environment variable set globally
      run: |
        buildozer -v android debug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: pos-system-apk
        path: bin/*.apk
        retention-days: 30
